<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Three Cities Social · River North Calendar</title>
<style>
:root{--bg:#0e0d0c;--cell:#1c1a18;--cream:#e8dcc8;--muted:#9b9083;--accent:#c4785a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:#f3ebe0;font:14px system-ui,sans-serif;overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column;padding:16px;gap:10px}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;border-bottom:1px solid #403a34;padding-bottom:10px}
.brand{font:600 22px Georgia,serif;color:var(--cream)}.brand small{display:block;font:11px system-ui;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-top:4px}
.title{text-align:center;font:600 26px Georgia,serif}.title small{display:block;font:11px system-ui;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.clock{text-align:right;color:var(--cream);font:18px Georgia,serif}
.weather-strip{display:flex;justify-content:flex-end;gap:6px;font-size:12px;color:var(--muted);margin-top:2px}
.weather-strip[hidden]{display:none}
.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.weekday{text-align:center;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}
.grid{flex:1;min-height:0;grid-template-rows:repeat(6,1fr)}
.day{min-height:0;overflow:hidden;background:var(--cell);border:1px solid #302b27;border-radius:8px;padding:6px}
.day.outside{opacity:.35}.day.today{border-color:var(--accent)}
.num{font:600 18px Georgia,serif;color:var(--cream);margin-bottom:4px}
.ev{border-left:2px solid var(--accent);background:#292520;padding:3px 4px;border-radius:2px;font-size:11px;margin-top:3px;overflow:hidden}
.ev b{display:block}.ev small{color:var(--muted)}
footer{border-top:1px solid #302b27;padding-top:6px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tour{color:var(--accent)}
</style></head>
<body><div class="app">
<header>
<div class="brand">Three Cities Social<small>River North · 320 W. Ohio #7E</small></div>
<div class="title" id="title">Loading<small>Month view · What's on at the club</small></div>
<div class="clock"><span id="clock"></span>
<div class="weather-strip" id="weatherStrip" aria-live="polite" hidden>
<span id="weatherMain"></span> <span id="weatherRange"></span>
</div></div>
</header>
<div class="weekdays"><div class="weekday">Sun</div><div class="weekday">Mon</div><div class="weekday">Tue</div><div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div><div class="weekday">Sat</div></div>
<main class="grid" id="grid"></main>
<footer>River North TV · <span id="status">Loading…</span> · <a class="tour" href="https://meetings-na2.hubspot.com/draymond?uuid=0f6ed97e-5852-459c-9c39-32b3e2f93b04">Book a tour</a></footer>
</div>
<script>
const TZ='America/Chicago';
const WEATHER_URL='https://api.open-meteo.com/v1/forecast?latitude=41.8925&longitude=-87.6368&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FChicago&forecast_days=1';
let events=[];
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now=()=>new Date(new Date().toLocaleString('en-US',{timeZone:TZ}));
const startSunday=d=>{let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=t=>{if(!t)return'';if(t==='24:00')return'12am';let[a,b]=t.split(':').map(Number),ap=a>=12?'pm':'am';return`${a%12||12}${b?':'+pad(b):''}${ap}`};
const W={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',61:'Light rain',63:'Rain',71:'Light snow',73:'Snow',95:'Thunderstorm'};
async function loadWeather(){
  const strip=document.getElementById('weatherStrip'),main=document.getElementById('weatherMain'),range=document.getElementById('weatherRange');
  try{
    const res=await fetch(WEATHER_URL,{cache:'no-store'});
    if(!res.ok)throw 0;
    const data=await res.json();
    const t=Number(data.current?.temperature_2m);
    const hi=Number(data.daily?.temperature_2m_max?.[0]);
    const lo=Number(data.daily?.temperature_2m_min?.[0]);
    if(!Number.isFinite(t))throw 0;
    main.textContent=`${W[data.current.weather_code]||'Chicago'} ${Math.round(t)}°`;
    range.textContent=Number.isFinite(hi)&&Number.isFinite(lo)?`H ${Math.round(hi)}° / L ${Math.round(lo)}°`:'';
    strip.hidden=false;
  }catch(_){strip.hidden=true}
}
function render(){
  let n=now(),first=new Date(n.getFullYear(),n.getMonth(),1),start=startSunday(first),today=key(n),by={};
  events.forEach(e=>(by[e.date]??=[]).push(e));
  document.getElementById('title').innerHTML=first.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'<small>Month view · What\'s on at the club</small>';
  let html='';
  for(let i=0;i<42;i++){
    let d=new Date(start);d.setDate(start.getDate()+i);let k=key(d),list=by[k]||[],outside=d.getMonth()!==first.getMonth();
    html+=`<section class="day${outside?' outside':''}${k===today?' today':''}"><div class="num">${d.getDate()}</div>${list.slice(0,4).map(e=>`<div class="ev"><b>${esc(e.title)}</b><small>${esc(e.start&&e.end?tm(e.start)+'–'+tm(e.end):tm(e.start||e.end))}</small></div>`).join('')}</section>`;
  }
  document.getElementById('grid').innerHTML=html;
}
function tick(){document.getElementById('clock').textContent=now().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
async function boot(){
  try{
    let r=await fetch('events.json',{cache:'no-store'});
    if(!r.ok)throw 0;
    let j=await r.json();
    events=Array.isArray(j)?j:(j.events||[]);
    document.getElementById('status').textContent=`Auto-refresh · ${events.length} events`;
  }catch(_){document.getElementById('status').textContent='Events unavailable'}
  render();tick();await loadWeather();
}
boot();
setInterval(tick,15000);
setInterval(loadWeather,15*60*1000);
setInterval(boot,7*60*1000);
window.addEventListener('resize',render);
</script></body></html>
