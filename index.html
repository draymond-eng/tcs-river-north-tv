<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three Cities Social · River North Calendar</title>
<style>
:root{--bg:#0e0d0c;--cell:#1c1a18;--cream:#e8dcc8;--muted:#9b9083;--accent:#c4785a}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:#f3ebe0;font:14px system-ui,-apple-system,Segoe UI,sans-serif}body{padding:20px}.app{height:calc(100vh - 40px);display:flex;flex-direction:column;gap:14px}header{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid #403a34;padding-bottom:12px}.brand{font:600 25px Georgia,serif;color:var(--cream)}.brand small{display:block;font:12px system-ui;text-transform:uppercase;letter-spacing:.2em;color:var(--accent);margin-top:5px}.title{text-align:center;font:600 30px Georgia,serif}.title small{display:block;font:12px system-ui;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}.clock{text-align:right;color:var(--cream);font:20px Georgia,serif}.clock small{display:block;color:var(--muted);font:11px system-ui}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.weekday{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.15em;text-transform:uppercase;padding:2px}.grid{flex:1;min-height:0;grid-template-rows:repeat(6,1fr)}.day{min-height:0;overflow:hidden;background:var(--cell);border:1px solid #302b27;border-radius:8px;padding:8px}.day.outside{opacity:.35}.day.today{border-color:var(--accent);box-shadow:0 0 0 1px #704331}.num{font:600 20px Georgia,serif;color:var(--cream);margin-bottom:6px}.today .num{color:#e0a083}.events{display:flex;flex-direction:column;gap:4px;overflow:hidden}.event{border-left:2px solid var(--accent);background:#292520;padding:4px 5px;border-radius:2px;font-size:12px;line-height:1.2;overflow:hidden}.event b{display:block;font-weight:600}.event small{color:var(--muted)}.more{color:var(--accent);font-size:11px;margin-top:3px}footer{border-top:1px solid #302b27;padding-top:8px;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}@media(max-width:900px){.title{font-size:22px}.brand{font-size:18px}.clock{font-size:16px}.day{padding:5px}.event{font-size:10px}}
</style>
</head>
<body><div class="app"><header><div class="brand">Three Cities Social<small>River North · 320 W. Ohio #7E</small></div><div class="title" id="title">Loading<small>Month view · What's on at the club</small></div><div class="clock"><span id="clock"></span><small>America/Chicago</small></div></header><div class="weekdays"> <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><main class="grid" id="grid"></main><footer>River North TV Calendar · <span id="status">Loading events…</span></footer></div>
<script>
const TZ='America/Chicago';let events=[];const pad=n=>String(n).padStart(2,'0');const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const now=()=>new Date(new Date().toLocaleString('en-US',{timeZone:TZ}));const startSunday=d=>{let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x};const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const tm=t=>{if(!t)return'';if(t==='24:00')return'12am';let[a,b]=t.split(':').map(Number),ap=a>=12?'pm':'am';return`${a%12||12}${b?':'+pad(b):''}${ap}`};
function render(){let n=now(),first=new Date(n.getFullYear(),n.getMonth(),1),start=startSunday(first),today=key(n),by={};events.forEach(e=>(by[e.date]??=[]).push(e));document.getElementById('title').innerHTML=first.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'<small>Month view · What’s on at the club</small>';let html='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=key(d),list=by[k]||[],outside=d.getMonth()!==first.getMonth();html+=`<section class="day${outside?' outside':''}${k===today?' today':''}"><div class="num">${d.getDate()}</div><div class="events">${list.slice(0,4).map(e=>`<div class="event"><b>${esc(e.title)}</b><small>${esc(e.start&&e.end?tm(e.start)+'–'+tm(e.end):tm(e.start||e.end))}</small></div>`).join('')}${list.length>4?`<div class="more">+${list.length-4} more</div>`:''}</div></section>`}document.getElementById('grid').innerHTML=html}
function tick(){document.getElementById('clock').textContent=now().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}async function boot(){try{let r=await fetch('events.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);let j=await r.json();events=Array.isArray(j)?j:(j.events||[]);document.getElementById('status').textContent=`Auto-refresh · ${events.length} events`}catch(e){document.getElementById('status').textContent='Events unavailable'}render();tick()}boot();setInterval(tick,15000);setInterval(boot,420000);window.addEventListener('resize',render);
</script></body></html>
